name: Create signing keystore (run once)

on:
  workflow_dispatch: {}

jobs:
  make:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias guide \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass guide12345 \
            -keypass guide12345 \
            -dname "CN=Surrogacy Guide, OU=Mobile, O=Surrogacy Guide, L=Delhi, ST=Delhi, C=IN"

      - name: Commit it back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f app/release.keystore
          git commit -m "Add signing keystore" || echo "nothing to commit"
          git push
